<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFSUN6T9 - Official</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{height:100vh;overflow:hidden;background:#000;color:#fff;display:flex;align-items:center;justify-content:center}
#bg-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:-1}
.container{width:90%;max-width:420px;display:flex;flex-direction:column;gap:16px;z-index:5}
.row{display:flex;gap:16px;width:100%}
.row .btn{flex:1}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:18px 10px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.18);
  color:#fff;text-decoration:none;font-weight:700;font-size:15px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  transition:0.3s;
}
.btn i{font-size:21px}
.btn:hover{background:rgba(255,255,255,0.14);transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,0.4)}
.btn.telegram{width:100%}
#soundBtn{position:fixed;bottom:22px;right:22px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);padding:10px 18px;border-radius:50px;cursor:pointer;color:#fff;font-size:13px;z-index:10}
</style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video" poster="avatar.png">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">
  <div class="row">
    <a class="btn" href="https://wa.me/8801317021116" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
    <a class="btn" href="https://discord.gg/z8Xye89Z8s" target="_blank"><i class="fab fa-discord"></i> Discord</a>
  </div>
  <a class="btn telegram" href="https://t.me/RAFSUN6T9" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
</div>

<button id="soundBtn">🔇 Sound Off</button>

<script>
const video=document.getElementById('bg-video');
const btn=document.getElementById('soundBtn');
let muted=true;
video.muted=true;
video.play().catch(()=>{});
btn.onclick=()=>{
  if(muted){video.muted=false;btn.innerText="🔊 Sound On";muted=false;}
  else{video.muted=true;btn.innerText="🔇 Sound Off";muted=true;}
};
</script>

</body>
</html>
